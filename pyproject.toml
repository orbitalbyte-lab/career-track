[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-track"
version = "0.1.0"
description = "A professional job and internship application tracking system."
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]